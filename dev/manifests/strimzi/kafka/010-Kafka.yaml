---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: controller-np
  namespace: strimzi-kafka
  labels:
    strimzi.io/cluster: mcp-cluster
    mcp: strimzi
    system: strimzi
spec:
  replicas: 3
  roles:
    - controller
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 10Gi
        kraftMetadata: shared
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: broker-np1
  namespace: strimzi-kafka
  labels:
    strimzi.io/cluster: mcp-cluster
    mcp: strimzi
    system: strimzi
spec:
  replicas: 3
  roles:
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 50Gi
        # Indicates that this directory will be used to store Kraft metadata log
        kraftMetadata: shared
      - id: 1
        type: persistent-claim
        size: 50Gi
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: broker-np2
  namespace: strimzi-kafka
  labels:
    strimzi.io/cluster: mcp-cluster
    mcp: strimzi
    system: strimzi
spec:
  replicas: 3
  roles:
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 50Gi
        # Indicates that this directory will be used to store Kraft metadata log
        kraftMetadata: shared
      - id: 1
        type: persistent-claim
        size: 50Gi
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: mcp-cluster
  namespace: strimzi-kafka
  labels:
    mcp: strimzi
    system: strimzi
spec:
  kafka:
    version: 4.3.1
    metadataVersion: 4.3-IV0
    authorization:
      type: simple
      superUsers:
        - CN=super-karel
        - super-karel
        - CN=console-user
        - console-user
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
        authentication:
          type: tls
      - name: route
        port: 9666
        type: route
        tls: true
        authentication:
          type: tls
      - name: console
        port: 9777
        tls: true
        type: internal
        authentication:
          type: scram-sha-512
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
      log.retention.hours: -1 # i.e., not time limit is applied
      log.retention.bytes: 128000000  # 128 MB
      log.segment.bytes: 64000000
    metricsConfig:
      type: strimziMetricsReporter
  entityOperator:
    topicOperator: {}
    userOperator: {}
  cruiseControl:
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          key: cruise-control-metrics-config.yml
          name: kafka-metrics
  kafkaExporter:
    topicRegex: ".*"
    groupRegex: ".*"
---
kind: ConfigMap
apiVersion: v1
metadata:
  name: kafka-metrics
  namespace: strimzi-kafka
  labels:
    app: strimzi
    mcp: strimzi
    system: strimzi
data:
  cruise-control-metrics-config.yml: |
    # Cruise Control MBeans are kafka.cruisecontrol:name=<Component>-<metric>, so one rule
    # covers them all. safeName() lowercases and maps '-' to '_', producing the names in
    # CruiseControlMetricCategories (e.g. kafka_cruisecontrol_loadmonitor_valid_windows_value).
    lowercaseOutputName: true
    rules:
      - pattern: kafka.cruisecontrol<name=(.+)><>(\w+)
        name: kafka_cruisecontrol_$1_$2
        type: GAUGE
