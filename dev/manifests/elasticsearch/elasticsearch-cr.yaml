---
# Note: ClusterLogForwarder API key token is created by the setup script.
# The script creates an Elasticsearch API key with minimal permissions (write to kubernetes* indices)
# and stores the encoded token in the elasticsearch-logforwarder-token secret.
# This is more secure than using username/password (no superuser credentials, revocable token).
---
apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: elasticsearch
  namespace: elasticsearch-logging
spec:
  version: 9.5.1
  nodeSets:
    - name: default
      count: 1
      config:
        node.store.allow_mmap: false
      podTemplate:
        spec:
          containers:
            - name: elasticsearch
              resources:
                requests:
                  memory: 1Gi
                  cpu: 500m
                limits:
                  memory: 2Gi
      volumeClaimTemplates:
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 5Gi
