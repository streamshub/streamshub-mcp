quarkus.arc.remove-unused-beans=false

# Test-only KubernetesResourceServiceTestFactory lives in common's package; silence the split-package warning
quarkus.arc.ignored-split-packages=io.streamshub.mcp.common.service

# Mock Kubernetes client for tests
quarkus.kubernetes-client.trust-certs=true
quarkus.kubernetes-client.namespace=test

# Disable resource watches in tests (no live cluster)
mcp.resource-watches.enabled=false

# Disable scheduler in tests (no live cluster)
quarkus.scheduler.enabled=false

# Log configuration for tests
mcp.log.tail-lines=200
