name: Container Image

on:
  push:
    branches:
      - main
  pull_request:

env:
  REGISTRY: quay.io
  IMAGE_GROUP: streamshub

jobs:
  container-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up JDK 21
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Cache Maven packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Build container images (PR)
      if: github.event_name == 'pull_request'
      run: |
        ./mvnw package -DskipTests \
          -Dquarkus.container-image.build=true

    - name: Login to container registry
      if: github.event_name == 'push'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.IMAGE_REPO_USERNAME }}
        password: ${{ secrets.IMAGE_REPO_PASSWORD }}

    - name: Build and push container images (main)
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        ./mvnw package -DskipTests \
          -Dquarkus.container-image.build=true \
          -Dquarkus.container-image.push=true \
          -Dquarkus.container-image.registry=${{ env.REGISTRY }} \
          -Dquarkus.container-image.group=${{ env.IMAGE_GROUP }} \
          -Dquarkus.container-image.tag=latest

    - name: Set up QEMU
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

    - name: Set up Docker Buildx
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Build and push Connect image (main)
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        ./mvnw package -pl systemtest -Pbuild-connect-image -DskipTests \
          -Dcontainer.engine=docker
