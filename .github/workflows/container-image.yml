name: Container Image

on:
  push:
    branches:
      - main
  pull_request:

env:
  REGISTRY: quay.io
  IMAGE_GROUP: streamshub

jobs:
  container-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Set up JDK 21
      uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Cache Maven packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Build container images (PR)
      if: github.event_name == 'pull_request'
      run: |
        ./mvnw package -DskipTests \
          -Dquarkus.container-image.build=true

    - name: Login to container registry
      if: github.event_name == 'push'
      uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.IMAGE_REPO_USERNAME }}
        password: ${{ secrets.IMAGE_REPO_PASSWORD }}

    - name: Build and push container images (main)
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        ./mvnw package -DskipTests \
          -Dquarkus.container-image.build=true \
          -Dquarkus.container-image.push=true \
          -Dquarkus.container-image.registry=${{ env.REGISTRY }} \
          -Dquarkus.container-image.group=${{ env.IMAGE_GROUP }} \
          -Dquarkus.container-image.tag=latest

    - name: Set up QEMU
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

    - name: Set up Docker Buildx
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

    - name: Build and push Connect image (main)
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        ./mvnw package -pl systemtest -Pbuild-connect-image -DskipTests \
          -Dcontainer.engine=docker
