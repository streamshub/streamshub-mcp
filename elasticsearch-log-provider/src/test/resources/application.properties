# Test configuration for Elasticsearch log provider
mcp.log.provider=streamshub-elasticsearch
mcp.log.elasticsearch.field.namespace=kubernetes.namespace_name
mcp.log.elasticsearch.field.pod=kubernetes.pod_name
mcp.log.elasticsearch.field.container=kubernetes.container_name
mcp.log.elasticsearch.field.message=message
mcp.log.elasticsearch.field.timestamp=@timestamp
mcp.log.elasticsearch.index-pattern=kubernetes-*

# Elasticsearch REST client (Quarkus-managed)
quarkus.rest-client.elasticsearch.url=http://localhost:9200
quarkus.rest-client.elasticsearch.scope=jakarta.inject.Singleton

# Disable Kubernetes client in tests
quarkus.kubernetes-client.trust-certs=true
