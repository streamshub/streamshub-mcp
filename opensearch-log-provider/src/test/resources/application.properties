# Test configuration for OpenSearch log provider
mcp.log.provider=streamshub-opensearch
mcp.log.opensearch.field.namespace=kubernetes.namespace_name
mcp.log.opensearch.field.pod=kubernetes.pod_name
mcp.log.opensearch.field.container=kubernetes.container_name
mcp.log.opensearch.field.message=message
mcp.log.opensearch.field.timestamp=@timestamp
mcp.log.opensearch.index-pattern=kubernetes-*

# OpenSearch REST client (Quarkus-managed)
quarkus.rest-client.opensearch.url=http://localhost:9200
quarkus.rest-client.opensearch.scope=jakarta.inject.Singleton

# Disable Kubernetes client in tests
quarkus.kubernetes-client.trust-certs=true
