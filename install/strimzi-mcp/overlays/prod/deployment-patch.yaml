apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamshub-mcp-strimzi
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: strimzi-mcp
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          # Later sources win on conflicting keys, so strimzi-mcp-config and
          # strimzi-mcp-secrets override the hardened defaults in strimzi-mcp-defaults.
          envFrom:
            - configMapRef:
                name: strimzi-mcp-defaults
            - configMapRef:
                name: strimzi-mcp-config
                optional: true
            - secretRef:
                name: strimzi-mcp-secrets
                optional: true
